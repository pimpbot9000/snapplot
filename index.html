<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuzzPlot – Zero Fuss, Just Plot!</title>
<style>
  :root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #d1d5db;
    --grid: #e5e7eb;
    --accent: #2563eb;
    --danger: #b91c1c;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .wrap {
    width: 100%;
    height: 100vh;
    padding-top: 10px;
    padding-bottom: 10px;
    padding-left: clamp(22px, 5vw, 90px);
    padding-right: clamp(22px, 5vw, 90px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 7px;
    flex: 0 0 auto;
  }

  .brand-logo {
    width: 32px;
    height: 32px;
    flex: 0 0 auto;
    color: var(--accent);
  }


  .brand-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .tagline {
    margin-top: 2px;
    font-size: 11px;
    line-height: 1.1;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: .01em;
  }

  h1 {
    margin: 0;
    font-size: 21px;
    line-height: 1.1;
  }

  .layout {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 320px;
    gap: 10px;
    overflow: hidden;
    align-items: stretch;
  }

  .panel {
    background: var(--panel);
    border: 1px solid #e5e7eb;
    border-radius: 11px;
    padding: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
    min-width: 0;
    min-height: 0;
  }

  .controls {
    overflow: hidden;
  }

  .field {
    margin-bottom: 8px;
  }

  label {
    display: block;
    font-weight: 700;
    margin-bottom: 3px;
    font-size: 12px;
  }

  input[type="range"] {
    width: 100%;
    height: 28px;
    margin: 0;
    accent-color: var(--accent);
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 13px;
    background: #fff;
    height: 30px;
  }

  .axis-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }

  .axis-step-row {
    display: grid;
    grid-template-columns: 1fr 0.82fr;
    gap: 8px;
    align-items: end;
  }

  input:disabled {
    background: #f3f4f6;
    color: #9ca3af;
    cursor: not-allowed;
  }

  .option-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 5px;
  }

  .option-row label {
    margin: 0;
    font-weight: 600;
    font-size: 12px;
  }

  #fitEquation {
    min-height: 18px;
    font-weight: 700;
    font-size: 13px;
    margin-top: 2px;
  }

  .hint {
    color: var(--muted);
    font-size: 10.5px;
    line-height: 1.25;
    margin: 7px 0 0;
  }

  .chart-panel {
    display: flex;
    flex-direction: column;
    padding: 8px;
    overflow: hidden;
  }

  .chart-toolbar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    margin-bottom: 5px;
  }

  .chart-toolbar-left {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .chart-toolbar-center {
    min-width: 0;
    display: flex;
    justify-content: center;
  }

  .chart-toolbar-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }

  .copy-status {
    font-size: 11px;
    color: var(--muted);
    min-height: 14px;
  }

  .chart-wrap {
    width: 100%;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 7px;
  }

  .data-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .data-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 0 0 auto;
    margin-bottom: 6px;
  }

  .data-header strong {
    font-size: 14px;
  }

  .buttons {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin: 0;
  }

  button {
    border: 0;
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 650;
  }

  .primary {
    background: var(--accent);
    color: #fff;
  }

  .secondary {
    background: #e5e7eb;
    color: #111827;
  }

  .trace-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 30px;
    padding: 0;
  }

  .trace-button svg {
    width: 17px;
    height: 17px;
    pointer-events: none;
  }

  .trace-button.active {
    background: #dbeafe;
    color: #1d4ed8;
    outline: 2px solid #93c5fd;
    outline-offset: -2px;
  }


  .delete {
    padding: 3px 7px;
    background: #fee2e2;
    color: var(--danger);
  }

  .table-scroll {
    min-height: 0;
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    border-top: 1px solid #eef0f3;
  }

  tfoot td {
    border-bottom: 0;
    padding-top: 7px;
  }

  .add-row-cell {
    text-align: left;
  }

  .add-row-cell button {
    width: 100%;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead {
    position: sticky;
    top: 0;
    background: #fff;
    z-index: 2;
  }

  th, td {
    border-bottom: 1px solid #e5e7eb;
    padding: 3px 2px;
    text-align: center;
  }

  th {
    font-size: 12px;
  }

  td input {
    text-align: center;
    height: 28px !important;
    padding: 3px 5px !important;
  }

  .ignore-col {
    width: 52px;
  }

  .ignore-cell {
    text-align: center;
  }

  .ignore-toggle {
    width: 16px;
    height: 16px;
    cursor: pointer;
    accent-color: var(--accent);
  }

  tr.ignored-row td {
    background: #f3f4f6;
  }

  tr.ignored-row td input[type="text"] {
    background: #f3f4f6;
    color: #6b7280;
  }

  .row-actions {
    width: 34px;
  }

  @media (max-height: 700px) {
    .wrap { padding-top:7px; padding-bottom:7px; padding-left:clamp(12px, 2.5vw, 28px); padding-right:clamp(12px, 2.5vw, 28px); }
    .brand { margin-bottom:4px; gap:7px; } .brand-logo { width:27px; height:27px; } h1 { font-size:18px; }
    .layout { grid-template-columns: 250px minmax(450px, 0.82fr) 290px; gap: 7px; }
    .panel { padding: 7px; }
    .field { margin-bottom: 5px; }
    label { font-size: 11px; margin-bottom: 2px; }
    input[type="text"], input[type="number"], select {
      height: 27px;
      font-size: 12px;
      padding: 3px 5px;
    }
    .hint { display: none; }
    td input { height: 25px !important; }
  }

  @media (max-width: 1100px) {
    .layout {
      grid-template-columns: 230px minmax(420px, 0.82fr) 260px;
      gap: 7px;
    }
  }

  @media print {
    html, body { overflow: visible; height: auto; }
    body { background: #fff; }
    .controls, .data-panel { display: none; }
    .layout { display: block; }
    .chart-panel {
      border: 0;
      box-shadow: none;
      padding: 0;
      height: 95vh;
    }
    .wrap { height: auto; padding: 0; }
    h1 { display: none; }
  }

  /* Mobile layout ------------------------------------------------------- */
  @media (max-width: 700px) {
    html, body {
      height: auto;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body {
      margin: 0;
    }

    .wrap {
      width: 100%;
      height: auto;
      min-height: 100%;
      overflow: visible;
      padding: 10px;
    }

    .brand {
      margin-bottom: 8px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
    }

    h1 {
      font-size: 21px;
    }

    .tagline {
      font-size: 10px;
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: visible;
    }

    /* Mobile order: chart -> data -> settings */
    .chart-panel {
      order: 1;
      min-height: 0;
      height: auto;
      overflow: visible;
    }

    .data-panel {
      order: 2;
      min-height: 0;
      height: auto;
      overflow: visible;
    }

    .settings-panel {
      order: 3;
      min-height: 0;
      height: auto;
      overflow: visible;
    }

    .chart-toolbar {
      grid-template-columns: auto 1fr auto;
      margin-bottom: 6px;
    }

    .chart-wrap,
    .canvas-wrap {
      min-height: 0;
      height: auto;
    }

    canvas#chart {
      display: block;
      width: 100% !important;
      height: 330px !important;
      min-height: 330px;
      max-height: none;
      touch-action: manipulation;
    }

    .table-scroll {
      flex: none;
      max-height: 320px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .axis-grid,
    .axis-step-row {
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      min-width: 0;
    }

    input[type="text"],
    input[type="number"],
    select {
      font-size: 16px;
      min-height: 40px;
    }

    td input {
      height: 40px !important;
      font-size: 16px;
    }

    button {
      min-height: 40px;
      font-size: 14px;
    }

    .trace-button {
      width: 40px;
      height: 40px;
    }

    .delete {
      min-height: 36px;
      min-width: 36px;
      padding: 4px 8px;
    }

    .option-row {
      gap: 12px;
      flex-wrap: wrap;
    }

    .option-row label {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .option-row input[type="checkbox"],
    .ignore-toggle {
      width: 20px;
      height: 20px;
    }

    .row-actions {
      width: 44px;
    }

    .ignore-col {
      width: 58px;
    }

    th {
      font-size: 12px;
    }

    th, td {
      padding: 4px 3px;
    }
  }

  @media (max-width: 420px) {
    .wrap {
      padding: 8px;
    }

    canvas#chart {
      height: 300px !important;
      min-height: 300px;
    }

    .axis-grid,
    .axis-step-row {
      grid-template-columns: 1fr;
    }

    .chart-toolbar {
      gap: 6px;
    }

    .chart-toolbar-right {
      gap: 5px;
    }

    #copyChartBtn {
      padding-left: 8px;
      padding-right: 8px;
      font-size: 13px;
    }

    .table-scroll {
      max-height: 280px;
    }
  }

</style>
</head>

<body>
<div class="wrap">
  <div class="brand">
  <svg class="brand-logo" viewBox="0 0 48 48" role="img" aria-label="FuzzPlot logo">
    <rect x="1" y="1" width="46" height="46" rx="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M11 36V12M11 36H38" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M14 32C19 30 21 24 25 23C29 22 31 15 37 13" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="16" cy="30" r="2.4" fill="currentColor"/>
    <circle cx="24" cy="24" r="2.4" fill="currentColor"/>
    <circle cx="31" cy="18" r="2.4" fill="currentColor"/>
    <circle cx="37" cy="13" r="2.4" fill="currentColor"/>
  </svg>
  <div class="brand-text"><h1>FuzzPlot</h1><div class="tagline">Zero Fuss, Just Plot!</div></div>
</div>

  <div class="layout">
    <section class="panel controls">
      <div class="axis-grid">
        <div class="field">
          <label for="xTitle">x-akselin otsikko</label>
          <input id="xTitle" type="text" value="Aika (s)">
        </div>
        <div class="field">
          <label for="yTitle">y-akselin otsikko</label>
          <input id="yTitle" type="text" value="Matka (m)">
        </div>
      </div>

      <div class="axis-grid">
        <div class="field">
          <label for="xMax">x-akselin maksimi</label>
          <input id="xMax" type="number" min="0" step="any" value="10">
        </div>
        <div class="field">
          <label for="yMax">y-akselin maksimi</label>
          <input id="yMax" type="number" min="0" step="any" value="20">
        </div>
      </div>

      <div class="axis-grid">
        <div class="axis-step-row">
          <div class="field">
            <label for="xStep">x-akselin askel</label>
            <input id="xStep" type="number" min="0" step="any" value="1">
          </div>
          <div class="field">
            <label for="xMinorDivisions">apuruudut</label>
            <input id="xMinorDivisions" type="number" min="1" step="1" value="2" disabled>
          </div>
        </div>

        <div class="axis-step-row">
          <div class="field">
            <label for="yStep">y-akselin askel</label>
            <input id="yStep" type="number" min="0" step="any" value="2">
          </div>
          <div class="field">
            <label for="yMinorDivisions">apuruudut</label>
            <input id="yMinorDivisions" type="number" min="1" step="1" value="2" disabled>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="fitType">Sovitus</label>
        <select id="fitType">
          <option value="none">Ei sovitusta</option>
          <option value="linear">Lineaarinen: y = kx + b</option>
          <option value="proportional">Suoraan verrannollisuus: y = kx</option>
          <option value="quadratic">Kvadraattinen: y = ax²</option>
          <option value="exponentialE">Eksponentiaalinen: y = ae^(bx)</option>
          <option value="exponentialQ">Eksponentiaalinen: y = aq^x</option>
          <option value="sqrt">Neliöjuuri: y = k√x</option>
          <option value="inverse">Kääntäen verrannollinen: y = k/x</option>
          <option value="quadraticGeneral">Toisen asteen: y = ax² + bx + c</option>
          <option value="cubic">Kuutiollinen: y = ax³ + bx² + cx + d</option>
        </select>
      </div>

      <div class="field" id="originConstraintField" style="display:none;">
        <label style="display:flex;align-items:center;gap:7px;font-weight:600;">
          <input type="checkbox" id="throughOrigin">
          Käyrä kulkee origon kautta
        </label>
      </div>

      <div class="field">
        <label for="axisFontSize">Akselitekstin koko: <span id="axisFontSizeValue">100</span> %</label>
        <input id="axisFontSize" type="range" min="70" max="160" step="5" value="100">
      </div>

      <div id="fitEquation"></div>

      <div class="option-row">
        <label><input type="checkbox" id="showGrid" checked> Ruudukko</label>
        <label><input type="checkbox" id="showMinorGrid"> Apuruudut</label>
      </div>

      <p class="hint">
        Vain positiiviset akselit näytetään. Pilkku käy desimaalierottimeksi.
        Maksimin tai askeleen voi jättää tyhjäksi, jolloin sopiva arvo valitaan automaattisesti.
      </p>
    </section>

    <section class="panel chart-panel">
      <div class="chart-toolbar">
        <div class="chart-toolbar-left">
          <button
            class="secondary trace-button"
            id="traceBtn"
            type="button"
            title="Trace: klikkaa sovituskäyrää"
            aria-label="Trace"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 2v5M12 17v5M2 12h5M17 12h5"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="chart-toolbar-center"></div>

        <div class="chart-toolbar-right">
          <span id="chartCopyStatus" class="copy-status"></span>
          <button class="secondary" id="copyChartBtn">Kopioi kuvaaja</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="chart" width="900" height="620"></canvas>
      </div>
    </section>

    <section class="panel data-panel">
      <div class="data-header">
        <strong>Data</strong>
        <div class="buttons">
          <button class="secondary" id="clearBtn">Tyhjennä</button>
          <button class="secondary" id="copyTableBtn">Kopioi taulukko</button>
        </div>
        <span id="tableCopyStatus" class="copy-status"></span>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th id="tableXHeader">x</th>
              <th id="tableYHeader">y</th>
              <th class="ignore-col">Ohita</th>
              <th class="row-actions"></th>
            </tr>
          </thead>
          <tbody id="dataBody"></tbody>
          <tfoot>
            <tr>
              <td colspan="4" class="add-row-cell">
                <button class="secondary" id="addRow">+ Lisää rivi</button>
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>
  </div>
</div>

<script>
const body = document.getElementById("dataBody");
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

let traceEnabled = false;
let traceX = null;
let currentTraceGeometry = null;

function addRow(x = "", y = "", ignored = false) {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input class="data-input x-input" type="text" inputmode="decimal" value="${x}"></td>
    <td><input class="data-input y-input" type="text" inputmode="decimal" value="${y}"></td>
    <td class="ignore-cell"><input class="ignore-toggle" type="checkbox" title="Ohita sovituksessa" ${ignored ? "checked" : ""}></td>
    <td><button class="delete" title="Poista rivi">×</button></td>
  `;

  const xInput = tr.querySelector(".x-input");
  const yInput = tr.querySelector(".y-input");
  const dataInputs = [xInput, yInput];
  const ignoreToggle = tr.querySelector(".ignore-toggle");

  function syncIgnoredState() {
    tr.classList.toggle("ignored-row", ignoreToggle.checked);
  }

  tr.querySelector(".delete").addEventListener("click", () => {
    tr.remove();
    draw();
  });

  dataInputs.forEach(inp => {
    inp.addEventListener("input", draw);

    inp.addEventListener("keydown", (e) => {
      if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;

      const row = inp.closest("tr");
      const rows = [...body.querySelectorAll("tr")];
      const rowIndex = rows.indexOf(row);
      const inputs = [...row.querySelectorAll("input.data-input")];
      const colIndex = inputs.indexOf(inp);

      let target = null;

      if (e.key === "ArrowLeft") {
        if (colIndex > 0) {
          target = inputs[colIndex - 1];
        }
      }

      if (e.key === "ArrowRight") {
        if (colIndex < inputs.length - 1) {
          target = inputs[colIndex + 1];
        }
      }

      if (e.key === "ArrowUp") {
        if (rowIndex > 0) {
          const targetInputs = rows[rowIndex - 1].querySelectorAll("input.data-input");
          target = targetInputs[colIndex];
        }
      }

      if (e.key === "ArrowDown") {
        if (rowIndex < rows.length - 1) {
          const targetInputs = rows[rowIndex + 1].querySelectorAll("input.data-input");
          target = targetInputs[colIndex];
        } else {
          addRow();
          const updatedRows = [...body.querySelectorAll("tr")];
          const targetInputs = updatedRows[updatedRows.length - 1].querySelectorAll("input.data-input");
          target = targetInputs[colIndex];
        }
      }

      if (target) {
        e.preventDefault();
        target.focus();
        target.select();
      }
    });
  });

  ignoreToggle.addEventListener("change", () => {
    syncIgnoredState();
    draw();
  });

  syncIgnoredState();
  body.appendChild(tr);
}

function parseNum(v) {
  if (v == null) return NaN;

  const s = String(v).trim();
  if (s === "") return NaN;

  return Number(s.replace(",", "."));
}


function syncMinorGridControls() {
  const enabled = document.getElementById("showMinorGrid").checked;
  document.getElementById("xMinorDivisions").disabled = !enabled;
  document.getElementById("yMinorDivisions").disabled = !enabled;
}

function syncTableHeaders() {
  const xTitle = document.getElementById("xTitle").value.trim() || "x";
  const yTitle = document.getElementById("yTitle").value.trim() || "y";

  document.getElementById("tableXHeader").textContent = xTitle;
  document.getElementById("tableYHeader").textContent = yTitle;
}

function getData() {
  return [...body.querySelectorAll("tr")]
    .map(tr => {
      const xInput = tr.querySelector(".x-input");
      const yInput = tr.querySelector(".y-input");
      const ignoreToggle = tr.querySelector(".ignore-toggle");

      return {
        x: parseNum(xInput.value),
        y: parseNum(yInput.value),
        ignored: !!ignoreToggle?.checked
      };
    })
    .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y) && p.x >= 0 && p.y >= 0)
    .sort((a,b) => a.x - b.x);
}

function niceMax(value) {
  if (!Number.isFinite(value) || value <= 0) return 10;
  const raw = value * 1.1;
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / power;
  let nice;
  if (n <= 1) nice = 1;
  else if (n <= 2) nice = 2;
  else if (n <= 5) nice = 5;
  else nice = 10;
  return nice * power;
}

function niceStep(maxVal, targetTicks = 10) {
  const rough = maxVal / targetTicks;
  const power = Math.pow(10, Math.floor(Math.log10(rough)));
  const n = rough / power;
  let nice;
  if (n <= 1) nice = 1;
  else if (n <= 2) nice = 2;
  else if (n <= 5) nice = 5;
  else nice = 10;
  return nice * power;
}

function fmt(n) {
  if (Math.abs(n) >= 1000 || (Math.abs(n) > 0 && Math.abs(n) < 0.01)) {
    return n.toExponential(1).replace(".", ",");
  }
  return String(Number(n.toFixed(6))).replace(".", ",");
}




function solveLinearSystem(A, b) {
  const n = A.length;
  const M = A.map((row, i) => [...row, b[i]]);

  for (let col = 0; col < n; col++) {
    let pivot = col;
    for (let r = col + 1; r < n; r++) {
      if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) pivot = r;
    }

    if (Math.abs(M[pivot][col]) < 1e-12) return null;

    [M[col], M[pivot]] = [M[pivot], M[col]];

    const p = M[col][col];
    for (let c = col; c <= n; c++) M[col][c] /= p;

    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = M[r][col];
      for (let c = col; c <= n; c++) {
        M[r][c] -= factor * M[col][c];
      }
    }
  }

  return M.map(row => row[n]);
}


function setFitMessage(element, text) {
  element.textContent = text;
  element.style.color = text.startsWith("Virhe:") ? "#dc2626" : "";
}

function fitPolynomialPowers(data, powers) {
  if (data.length < powers.length) return null;

  const size = powers.length;
  const A = Array.from({ length: size }, () => Array(size).fill(0));
  const b = Array(size).fill(0);

  for (const point of data) {
    for (let i = 0; i < size; i++) {
      const pi = powers[i];
      b[i] += point.y * point.x ** pi;

      for (let j = 0; j < size; j++) {
        A[i][j] += point.x ** (pi + powers[j]);
      }
    }
  }

  const coeffs = solveLinearSystem(A, b);
  if (!coeffs) return null;

  return {
    coeffs,
    fn: x => coeffs.reduce(
      (sum, coefficient, i) => sum + coefficient * x ** powers[i],
      0
    )
  };
}

function polynomialTerm(coefficient, power, isFirst) {
  const absCoefficient = Math.abs(coefficient);
  const sign = coefficient < 0 ? "−" : "+";

  let variable = "";
  if (power === 1) variable = "x";
  else if (power === 2) variable = "x²";
  else if (power === 3) variable = "x³";
  else if (power > 3) variable = `x^${power}`;

  const term = power === 0
    ? fmt(absCoefficient)
    : `${fmt(absCoefficient)}${variable}`;

  if (isFirst) {
    return coefficient < 0 ? `−${term}` : term;
  }

  return ` ${sign} ${term}`;
}

function formatPolynomial(coeffs, powers) {
  return "y = " + coeffs
    .map((coefficient, i) => polynomialTerm(coefficient, powers[i], i === 0))
    .join("");
}

function applyPolynomialFit(data, powers, fitEquation, errorMessage) {
  const result = fitPolynomialPowers(data, powers);

  if (!result) {
    setFitMessage(fitEquation, errorMessage);
    return null;
  }

  setFitMessage(fitEquation, formatPolynomial(result.coeffs, powers));
  return result.fn;
}

function updateOriginConstraintVisibility() {
  const field = document.getElementById("originConstraintField");
  if (!field) return;

  const fitType = document.getElementById("fitType").value;
  field.style.display = (fitType === "quadraticGeneral" || fitType === "cubic")
    ? "block"
    : "none";
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  const cssWidth = Math.max(500, Math.floor(rect.width));
  const cssHeight = Math.max(360, Math.floor(rect.height));

  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssWidth,cssHeight);

  const allData = getData();
  const fitData = allData.filter(p => !p.ignored);

  const typedXMax = parseNum(document.getElementById("xMax").value);
  const typedYMax = parseNum(document.getElementById("yMax").value);

  const dataXMax = allData.length ? Math.max(...allData.map(p => p.x)) : 10;
  const dataYMax = allData.length ? Math.max(...allData.map(p => p.y)) : 10;

  const xMax = Number.isFinite(typedXMax) && typedXMax > 0 ? typedXMax : niceMax(dataXMax);
  const yMax = Number.isFinite(typedYMax) && typedYMax > 0 ? typedYMax : niceMax(dataYMax);

  // Axis text scales with the chart dimensions, so browser zoom keeps
  // the visual proportions much more consistent.
  const axisScalePercent = Number(document.getElementById("axisFontSize").value) || 100;
  const axisScale = axisScalePercent / 100;

  const chartReference = Math.min(cssWidth, cssHeight);
  const responsiveAxisFontSize = Math.max(10, Math.min(22, chartReference * 0.026)) * axisScale;
  const responsiveTitleFontSize = responsiveAxisFontSize * 1.2;

  const margin = {
    left: Math.max(70, responsiveAxisFontSize * 5.2),
    right: Math.max(22, responsiveAxisFontSize * 1.8),
    top: Math.max(20, responsiveAxisFontSize * 1.7),
    bottom: Math.max(66, responsiveTitleFontSize * 4.1)
  };
  const plotW = cssWidth - margin.left - margin.right;
  const plotH = cssHeight - margin.top - margin.bottom;

  const sx = x => margin.left + (x / xMax) * plotW;
  const sy = y => margin.top + plotH - (y / yMax) * plotH;

  const typedXStep = parseNum(document.getElementById("xStep").value);
  const typedYStep = parseNum(document.getElementById("yStep").value);

  const xStep = Number.isFinite(typedXStep) && typedXStep > 0 ? typedXStep : niceStep(xMax);
  const yStep = Number.isFinite(typedYStep) && typedYStep > 0 ? typedYStep : niceStep(yMax);

  document.getElementById("axisFontSizeValue").textContent = axisScalePercent;

  ctx.font = `${responsiveAxisFontSize}px system-ui, sans-serif`;
  ctx.lineWidth = 1;

  const showGrid = document.getElementById("showGrid").checked;
  const showMinorGrid = document.getElementById("showMinorGrid").checked;

  const typedXMinorDivisions = parseNum(document.getElementById("xMinorDivisions").value);
  const typedYMinorDivisions = parseNum(document.getElementById("yMinorDivisions").value);

  const xMinorDivisions = Number.isFinite(typedXMinorDivisions) && typedXMinorDivisions >= 1
    ? Math.max(1, Math.round(typedXMinorDivisions))
    : 2;
  const yMinorDivisions = Number.isFinite(typedYMinorDivisions) && typedYMinorDivisions >= 1
    ? Math.max(1, Math.round(typedYMinorDivisions))
    : 2;

  // Minor grid first, so the darker main grid stays visually dominant.
  if (showGrid && showMinorGrid) {
    ctx.strokeStyle = "#e5e7eb";
    ctx.lineWidth = 1;

    const xMinorStep = xStep / xMinorDivisions;
    const yMinorStep = yStep / yMinorDivisions;

    for (let x = xMinorStep; x < xMax + xMinorStep * 0.001; x += xMinorStep) {
      const majorIndex = x / xStep;
      if (Math.abs(majorIndex - Math.round(majorIndex)) < 1e-8) continue;

      const px = sx(x);
      ctx.beginPath();
      ctx.moveTo(px, margin.top);
      ctx.lineTo(px, margin.top + plotH);
      ctx.stroke();
    }

    for (let y = yMinorStep; y < yMax + yMinorStep * 0.001; y += yMinorStep) {
      const majorIndex = y / yStep;
      if (Math.abs(majorIndex - Math.round(majorIndex)) < 1e-8) continue;

      const py = sy(y);
      ctx.beginPath();
      ctx.moveTo(margin.left, py);
      ctx.lineTo(margin.left + plotW, py);
      ctx.stroke();
    }
  }

  ctx.fillStyle = "#4b5563";

  for (let x = 0; x <= xMax + xStep*0.001; x += xStep) {
    const px = sx(x);

    if (showGrid) {
      ctx.strokeStyle = "#b8c2cf";
      ctx.beginPath();
      ctx.moveTo(px, margin.top);
      ctx.lineTo(px, margin.top + plotH);
      ctx.stroke();
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(fmt(x), px, margin.top + plotH + 10);
  }

  for (let y = 0; y <= yMax + yStep*0.001; y += yStep) {
    const py = sy(y);

    if (showGrid) {
      ctx.strokeStyle = "#b8c2cf";
      ctx.beginPath();
      ctx.moveTo(margin.left, py);
      ctx.lineTo(margin.left + plotW, py);
      ctx.stroke();
    }

    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(fmt(y), margin.left - 10, py);
  }

  // Positive axes only: origin at bottom-left, no negative regions.
  ctx.strokeStyle = "#111827";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(margin.left, margin.top);
  ctx.lineTo(margin.left, margin.top + plotH);
  ctx.lineTo(margin.left + plotW, margin.top + plotH);
  ctx.stroke();

  // ticks
  ctx.lineWidth = 1.5;
  for (let x = 0; x <= xMax + xStep*0.001; x += xStep) {
    const px = sx(x);
    ctx.beginPath();
    ctx.moveTo(px, margin.top + plotH);
    ctx.lineTo(px, margin.top + plotH + 6);
    ctx.stroke();
  }
  for (let y = 0; y <= yMax + yStep*0.001; y += yStep) {
    const py = sy(y);
    ctx.beginPath();
    ctx.moveTo(margin.left - 6, py);
    ctx.lineTo(margin.left, py);
    ctx.stroke();
  }

  const visible = allData.filter(p => p.x <= xMax && p.y <= yMax);
  const visibleIncluded = visible.filter(p => !p.ignored);
  const visibleIgnored = visible.filter(p => p.ignored);

  // Sovitus
  const fitType = document.getElementById("fitType").value;
  const fitEquation = document.getElementById("fitEquation");
  setFitMessage(fitEquation, "");

  let fitFn = null;

  if (fitType === "linear") {
    fitFn = applyPolynomialFit(
      fitData,
      [1, 0],
      fitEquation,
      "Virhe: lineaarinen sovitus tarvitsee vähintään 2 toisistaan poikkeavaa x-arvoa."
    );
  }

  if (fitType === "proportional") {
    fitFn = applyPolynomialFit(
      fitData,
      [1],
      fitEquation,
      "Virhe: suoraan verrannollista sovitusta ei voitu laskea."
    );
  }

  if (fitType === "quadratic") {
    fitFn = applyPolynomialFit(
      fitData,
      [2],
      fitEquation,
      "Virhe: sovitusta y = ax² ei voitu laskea."
    );
  }

  if (fitType === "quadraticGeneral") {
    const throughOrigin = document.getElementById("throughOrigin").checked;
    const powers = throughOrigin ? [2, 1] : [2, 1, 0];

    fitFn = applyPolynomialFit(
      fitData,
      powers,
      fitEquation,
      throughOrigin
        ? "Virhe: origon kautta kulkeva toisen asteen sovitus tarvitsee vähintään 2 sopivaa pistettä."
        : "Virhe: toisen asteen sovitus tarvitsee vähintään 3 sopivaa pistettä."
    );
  }

  if (fitType === "cubic") {
    const throughOrigin = document.getElementById("throughOrigin").checked;
    const powers = throughOrigin ? [3, 2, 1] : [3, 2, 1, 0];

    fitFn = applyPolynomialFit(
      fitData,
      powers,
      fitEquation,
      throughOrigin
        ? "Virhe: origon kautta kulkeva kuutiollinen sovitus tarvitsee vähintään 3 sopivaa pistettä."
        : "Virhe: kuutiollinen sovitus tarvitsee vähintään 4 sopivaa pistettä."
    );
  }

  if (fitType === "exponentialE") {
    // Linearize ln(y) = ln(a) + bx. Only y > 0 is valid.
    const expData = fitData.filter(p => p.y > 0);

    if (expData.length >= 2) {
      const n = expData.length;
      const sx1 = expData.reduce((s,p) => s + p.x, 0);
      const slny = expData.reduce((s,p) => s + Math.log(p.y), 0);
      const sxx = expData.reduce((s,p) => s + p.x*p.x, 0);
      const sxlny = expData.reduce((s,p) => s + p.x*Math.log(p.y), 0);
      const den = n*sxx - sx1*sx1;

      if (Math.abs(den) > 1e-12) {
        const b = (n*sxlny - sx1*slny) / den;
        const lnA = (slny - b*sx1) / n;
        const a = Math.exp(lnA);

        fitFn = x => a * Math.exp(b*x);
        setFitMessage(fitEquation, `y = ${fmt(a)}e^(${fmt(b)}x)`);
      }
    }
  }

  if (fitType === "exponentialQ") {
    // Same exponential model, shown as y = a*q^x where q = e^b.
    const expData = fitData.filter(p => p.y > 0);

    if (expData.length >= 2) {
      const n = expData.length;
      const sx1 = expData.reduce((s,p) => s + p.x, 0);
      const slny = expData.reduce((s,p) => s + Math.log(p.y), 0);
      const sxx = expData.reduce((s,p) => s + p.x*p.x, 0);
      const sxlny = expData.reduce((s,p) => s + p.x*Math.log(p.y), 0);
      const den = n*sxx - sx1*sx1;

      if (Math.abs(den) > 1e-12) {
        const b = (n*sxlny - sx1*slny) / den;
        const lnA = (slny - b*sx1) / n;
        const a = Math.exp(lnA);
        const q = Math.exp(b);

        fitFn = x => a * Math.pow(q, x);
        setFitMessage(fitEquation, `y = ${fmt(a)}·${fmt(q)}^x`);
      }
    }
  }

  if (fitType === "sqrt") {
    // Least-squares fit through the origin for y = k*sqrt(x).
    const sqrtData = fitData.filter(p => p.x >= 0);

    if (sqrtData.length >= 1) {
      const num = sqrtData.reduce((s,p) => s + Math.sqrt(p.x)*p.y, 0);
      const den = sqrtData.reduce((s,p) => s + p.x, 0);

      if (den > 1e-12) {
        const k = num / den;
        fitFn = x => k * Math.sqrt(x);
        setFitMessage(fitEquation, `y = ${fmt(k)}√x`);
      }
    }
  }

  if (fitType === "inverse") {
    // y = k/x  ->  least squares in y = k*(1/x)
    // Any x = 0 makes the model undefined, so do not attempt the fit.
    const hasZeroX = fitData.some(p => Math.abs(p.x) < 1e-12);

    if (hasZeroX) {
      fitFn = null;
      setFitMessage(fitEquation, "Virhe: kääntäen verrannollista sovitusta ei voi tehdä, kun x = 0.");
    } else if (fitData.length >= 1) {
      const num = fitData.reduce((s,p) => s + (1 / p.x) * p.y, 0);
      const den = fitData.reduce((s,p) => s + 1 / (p.x * p.x), 0);

      if (den > 1e-12 && Number.isFinite(num) && Number.isFinite(den)) {
        const k = num / den;
        fitFn = x => {
          if (Math.abs(x) < 1e-12) return NaN;
          return k / x;
        };
        setFitMessage(fitEquation, `y = ${fmt(k)}/x`);
      } else {
        fitFn = null;
        setFitMessage(fitEquation, "Virhe: sovitusta ei voitu laskea.");
      }
    }
  }

  if (fitFn) {
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let started = false;
    const samples = 400;
    for (let i = 0; i <= samples; i++) {
      const x = xMax * i / samples;

      let y = NaN;
      try {
        y = fitFn(x);
      } catch {
        y = NaN;
      }

      if (Number.isFinite(y) && y >= 0 && y <= yMax) {
        const px = sx(x), py = sy(y);
        if (!started) {
          ctx.moveTo(px, py);
          started = true;
        } else {
          ctx.lineTo(px, py);
        }
      } else {
        started = false;
      }
    }
    ctx.stroke();
  }

  // Trace-työkalu: valitse x hiirellä ja näytä sovituskäyrän piste.
  currentTraceGeometry = {
    fitFn,
    xMax,
    yMax,
    margin,
    plotW,
    plotH,
    cssWidth,
    cssHeight
  };

  if (traceEnabled && traceX != null && fitFn) {
    const x = Math.max(0, Math.min(xMax, traceX));
    let y = NaN;

    try {
      y = fitFn(x);
    } catch {
      y = NaN;
    }

    if (Number.isFinite(y) && y >= 0 && y <= yMax) {
      const px = sx(x);
      const py = sy(y);

      ctx.save();
      ctx.strokeStyle = "#dc2626";
      ctx.fillStyle = "#dc2626";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]);

      // Pysty- ja vaakasuora apuviiva akseleille.
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px, margin.top + plotH);
      ctx.moveTo(px, py);
      ctx.lineTo(margin.left, py);
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(px, py, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
    }
  } else {
  }

  // Mittauspisteet
  ctx.fillStyle = "#2563eb";
  visibleIncluded.forEach(p => {
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), 5, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 2.2;
  visibleIgnored.forEach(p => {
    const px = sx(p.x);
    const py = sy(p.y);
    const r = 5.5;

    ctx.beginPath();
    ctx.moveTo(px - r, py - r);
    ctx.lineTo(px + r, py + r);
    ctx.moveTo(px + r, py - r);
    ctx.lineTo(px - r, py + r);
    ctx.stroke();
  });

  // axis titles
  ctx.fillStyle = "#111827";
  ctx.font = `600 ${responsiveTitleFontSize}px system-ui, sans-serif`;

  const xTitle = document.getElementById("xTitle").value.trim();
  const yTitle = document.getElementById("yTitle").value.trim();

  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.fillText(xTitle, margin.left + plotW/2, cssHeight - 12);

  ctx.save();
  ctx.translate(22, margin.top + plotH/2);
  ctx.rotate(-Math.PI/2);
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.fillText(yTitle, 0, 0);
  ctx.restore();
}

async function copyChartToClipboard() {
  const status = document.getElementById("chartCopyStatus");
  try {
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    if (!blob) throw new Error("Kuvan luonti epäonnistui");

    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([
        new ClipboardItem({ "image/png": blob })
      ]);
      status.textContent = "Kopioitu!";
      setTimeout(() => status.textContent = "", 1500);
    } else {
      throw new Error("Kuvan kopiointi ei ole tuettu tässä selaimessa");
    }
  } catch (err) {
    status.textContent = "Kopiointi epäonnistui";
    console.error(err);
  }
}

        <tr>
          <th>${escapeHtml(xHeader)}</th>
          <th>${escapeHtml(yHeader)}</th>
        </tr>
        ${htmlRows}
      </table>
      <!--EndFragment-->
    </body>
    </html>
  `;

  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        "text/html": new Blob([htmlTable], { type: "text/html" }),
        "text/plain": new Blob([plainText], { type: "text/plain" })
      })
    ]);

    status.textContent = "Kopioitu Excel-tyylisesti!";
    setTimeout(() => status.textContent = "", 1800);
  } catch (err) {
    console.error(err);

    try {
      await navigator.clipboard.writeText(plainText);
      status.textContent = "Data kopioitu!";
      setTimeout(() => status.textContent = "", 1800);
    } catch {
      status.textContent = "Kopiointi epäonnistui";
      setTimeout(() => status.textContent = "", 1800);
    }
  }
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

const traceBtn = document.getElementById("traceBtn");

traceBtn.addEventListener("click", () => {
  traceEnabled = !traceEnabled;
  traceBtn.classList.toggle("active", traceEnabled);
  traceBtn.setAttribute("aria-pressed", String(traceEnabled));

  if (!traceEnabled) {
    traceX = null;
  }

  canvas.style.cursor = traceEnabled ? "crosshair" : "";
  draw();
});

canvas.addEventListener("click", (event) => {
  if (!traceEnabled || !currentTraceGeometry?.fitFn) return;

  const rect = canvas.getBoundingClientRect();
  const clickX = event.clientX - rect.left;
  const clickY = event.clientY - rect.top;

  const { margin, plotW, plotH, xMax } = currentTraceGeometry;
  const insidePlot =
    clickX >= margin.left &&
    clickX <= margin.left + plotW &&
    clickY >= margin.top &&
    clickY <= margin.top + plotH;

  if (!insidePlot) return;

  traceX = ((clickX - margin.left) / plotW) * xMax;
  draw();
});

document.getElementById("copyChartBtn").addEventListener("click", copyChartToClipboard);
document.getElementById("copyTableBtn").addEventListener("click", copyTableToClipboard);

window.addEventListener("resize", draw);
syncTableHeaders();
updateOriginConstraintVisibility();
draw();
</script>
</body>
</html>
